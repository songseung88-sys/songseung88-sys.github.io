name: Deploy no-safe-tobacco to Firebase Hosting

# Publish only this site's files; other sites and repositories are unaffected.
on:
  push:
    branches:
      - main
    paths:
      - "safe-tobacco/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: no-safe-tobacco-firebase-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish safe-tobacco site only
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify site assets
        run: |
          test -s safe-tobacco/index.html
          test -s safe-tobacco/firebase.json
          test -s safe-tobacco/og-image.jpg

      - name: Deploy to Firebase Hosting live channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NO_SAFE_TOBACCO }}
          projectId: no-safe-tobacco
          channelId: live
          entryPoint: safe-tobacco
